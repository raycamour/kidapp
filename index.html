<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Learning is fun">
<meta name="theme-color" content="#ffc83d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Learning is fun</title>
<style>
:root{--bus:#ffc83d;--ink:#1f2a44;--paper:#fffdf7;--line:#d3e4f6;--margin:#f2a0a0;--go:#16804d;--again:#c43d28}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bus);color:var(--ink);font-family:"Chalkboard SE","Marker Felt","Comic Sans MS",ui-rounded,"Arial Rounded MT Bold",sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
#app{height:100%;max-width:900px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(20px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:5px solid var(--ink);outline-offset:3px}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}

h1{font-size:clamp(52px,10vw,88px);margin:24px 0 4px;line-height:1}
.sub{font-size:clamp(24px,4vw,32px);margin:0 0 32px}
#home h1{font-size:clamp(42px,8vw,68px);margin:10px 0 2px}
#home .sub{font-size:clamp(20px,3.5vw,28px);margin:0 0 14px}
.deck{width:100%;flex:1;min-height:0;background:var(--paper);border-radius:24px;padding:10px 16px;margin:0;text-align:left;box-shadow:0 5px 0 rgba(31,42,68,.25);display:flex;align-items:center;gap:10px}
.deck-main{flex:1;min-width:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;justify-content:center}
.deck b{display:block;font-size:clamp(26px,5vw,38px);line-height:1.05}
.deck span{display:block;font-size:clamp(17px,3.2vw,22px);line-height:1.1;margin:3px 0 7px}
.deck-reset{flex:0 0 auto;min-height:44px;padding:8px 10px;border-radius:15px;background:#f3ead5;font-size:clamp(14px,2.8vw,18px);font-weight:700;white-space:nowrap}
#list{flex:1;min-height:0;overflow:visible;padding:0 4px;display:flex;flex-direction:column;gap:10px}
.bar{display:block;height:18px;border-radius:9px;background:var(--line);overflow:hidden}
.bar u{display:block;height:100%;background:var(--go);border-radius:9px}
.deck .activity-progress{height:18px;margin:0}
.activity-progress{margin:-2px 0 14px}
.activity-progress .bar{height:14px}
.link{background:none;text-decoration:underline;font-size:22px;opacity:.75;padding:18px;margin:0}
.footer{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.install-link{font-size:20px;padding:14px 6px}
.micbtn{width:64px;height:64px;border-radius:50%;background:rgba(31,42,68,.15);display:grid;place-items:center}
.micbtn svg{width:32px;height:32px;fill:var(--ink)}
#gate{position:fixed;inset:0;background:rgba(31,42,68,.72);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
#gate.on{display:flex}
.gatebox{background:#fff;border-radius:30px;padding:36px;width:min(520px,100%);text-align:center}
.gatebox p{font-size:26px;margin:0 0 14px}
#gateQ{font-size:48px!important;font-weight:700}
#gateA{font:inherit;font-size:40px;width:100%;text-align:center;padding:12px;border-radius:16px;border:3px solid var(--line);color:var(--ink)}
.gbtns{display:flex;gap:16px;margin-top:20px}
.gbtns button{flex:1;min-height:80px;border-radius:22px;font-size:30px;color:#fff;background:var(--go)}
#gateNo{background:rgba(31,42,68,.65)}
#gateMsg{margin:14px 0 0!important;min-height:34px;color:var(--again)}
#installHelp{position:fixed;inset:0;z-index:11;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(31,42,68,.72)}
#installHelp.on{display:flex}
.installbox{width:min(540px,100%);padding:30px;border-radius:30px;background:var(--paper);text-align:center;box-shadow:0 8px 0 rgba(31,42,68,.25)}
.installbox h2{font-size:clamp(34px,7vw,48px);margin:0 0 14px}
.installbox p{font-size:clamp(23px,4.5vw,30px);line-height:1.35;margin:0 0 24px}
.installbox button{min-height:72px;width:100%;border-radius:22px;background:var(--go);color:#fff;font-size:30px;font-weight:700}

.reccount{font-size:24px}
.tabs{display:flex;gap:12px;margin-bottom:16px}
.tab{flex:1;min-height:60px;border-radius:20px;background:rgba(255,255,255,.55);font-size:26px}
.tab.on{background:var(--ink);color:#fff}
.stat{position:absolute;left:15%;bottom:30px;font-size:24px;opacity:.8}
.actions.three{grid-template-columns:1fr 2fr 1fr}
.actions .rec{background:var(--again)}
.actions .rec.live{background:var(--ink)}
.actions .nav{background:rgba(255,255,255,.8);color:var(--ink);box-shadow:0 7px 0 rgba(31,42,68,.25)}
.actions #prev:disabled{opacity:.45;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.back{background:rgba(255,255,255,.75);border-radius:22px;padding:12px 26px;min-height:60px;font-size:26px}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(31,42,68,.2)}
.dots i.on{background:var(--go)}
.card{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-color:var(--paper);border-radius:38px;box-shadow:0 9px 0 rgba(31,42,68,.25);
  background-image:linear-gradient(90deg,transparent 0 11%,var(--margin) 11% calc(11% + 3px),transparent calc(11% + 3px)),
    repeating-linear-gradient(180deg,transparent 0 71px,var(--line) 71px 74px)}
.word{font-size:clamp(64px,min(24vw,19vh),210px);font-weight:700;letter-spacing:.02em;line-height:1;width:100%;max-width:100%;padding:0 5%;text-align:center;white-space:nowrap}
.sentence{font-size:clamp(48px,min(9.5vw,7vh),84px);font-weight:700;line-height:1.4;text-align:center;padding:0 6% 120px 16%}
.scramble-card{display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;gap:16px;padding:24px;overflow-y:auto;background-image:none;background-color:#e8eef8}
.scramble-instruction{font-size:clamp(28px,5vw,40px);font-weight:700;text-align:center;margin:0}
.sentence-slots{flex:1;min-height:180px;display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:center;gap:14px;padding:18px 4px;border-radius:24px;background:rgba(255,255,255,.42)}
.answer-slot{height:72px;min-width:78px;max-width:100%;padding:8px 12px;border:3px dashed rgba(31,42,68,.4);border-radius:20px;background:rgba(255,255,255,.35);color:var(--ink);font-size:clamp(25px,5vw,40px);font-weight:700;overflow-wrap:anywhere;touch-action:none;user-select:none}
.answer-slot.filled{border-style:solid;background:#fff;box-shadow:0 6px 0 rgba(31,42,68,.18);cursor:grab}
.scramble-bank{display:flex;flex-wrap:wrap;align-content:flex-end;align-items:flex-end;justify-content:center;gap:12px;min-height:142px;padding:16px 4px 10px;border-top:3px dashed rgba(31,42,68,.22);touch-action:none}
.scramble-word{min-height:66px;max-width:100%;padding:10px 18px;border-radius:20px;background:#fff;color:var(--ink);font-size:clamp(25px,5.4vw,40px);font-weight:700;overflow-wrap:anywhere;box-shadow:0 6px 0 rgba(31,42,68,.22);touch-action:none;user-select:none;cursor:grab}
.answer-slot.dragging,.scramble-word.dragging{opacity:.65;z-index:2;cursor:grabbing;pointer-events:none}
.scramblefeedback{min-height:42px;text-align:center;font-size:clamp(24px,4vw,32px);font-weight:700;margin:0}
.scramblefeedback.correct{color:#12663e}
.scramblefeedback.wrong{color:#a51e12}
.card.pop .word,.card.pop .sentence{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card.pop .word,.card.pop .sentence{animation:none}}
.speak{position:absolute;right:24px;bottom:24px;width:104px;height:104px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.speak:disabled{opacity:.65;cursor:default}
.speak svg{width:54px;height:54px;fill:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.actions.one{grid-template-columns:1fr}
.actions button,.big{min-height:120px;border-radius:30px;font-size:clamp(30px,4.6vw,42px);font-weight:700;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.25)}
.actions button:active,.big:active,.deck:active{transform:translateY(5px);box-shadow:none}
.again{background:var(--again)}
.know,.big{background:var(--go)}

#done{align-items:center;justify-content:center;text-align:center}
#blockDone{align-items:center;justify-content:center;text-align:center}
#blockDone h2{font-size:clamp(52px,10vw,84px);margin:16px 0 8px}
#blockDone p{font-size:clamp(26px,4.5vw,36px);margin:0 0 32px}
.stars{font-size:clamp(52px,13vw,112px);line-height:1;letter-spacing:.03em}
#done h2{font-size:clamp(52px,10vw,84px);margin:16px 0 8px}
#done p{font-size:clamp(26px,4.5vw,36px);margin:0 0 48px}
.big{padding:0 56px}
.bondcard{flex-direction:column;justify-content:flex-start;gap:4px;padding:12px 6%;overflow-y:auto;background-image:none;background-color:#e8eef8}
.bondsvg{width:min(100%,460px);max-height:36vh;flex:0 0 auto;overflow:visible}
.bondsvg.three-on{max-height:28vh}
.bondline{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.three-bond,.three-part-node{display:none}
.bondsvg.three-on .three-bond,.bondsvg.three-on .three-part-node{display:inline}
.bondnode{fill:#fff;stroke:var(--ink);stroke-width:6}
.bondnode-square{display:none}
.bondsvg.square-on .bondnode-circle{display:none}
.bondsvg.square-on .bondnode-square{display:block}
.bondnode.missing{fill:#f2c14e}
.bondnode.subtraction-missing{fill:#78b6d6}
.bondnode.correct{fill:#b6eccb;stroke:#16804d;stroke-width:9}
.bondnode.wrong{fill:#ffc3b9;stroke:#c43d28;stroke-width:9}
.bondnumber{fill:var(--ink);font-size:54px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.bondnumber-whole{font-size:68px}
.bondnumber.correct{fill:#12663e}
.bondnumber.wrong{fill:#a51e12}
.equation{font-size:clamp(58px,16vmin,84px);font-weight:700;margin:auto 0 0;padding:8px 0;flex:0 0 auto;text-align:center;max-width:100%}
.equation.three-equation{font-size:clamp(34px,9.5vw,62px)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.choices.multi{display:flex;flex-direction:column;gap:8px}
.choice-heading{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 4px}
.choice-title{font-size:clamp(20px,3.4vw,26px);font-weight:700;text-align:center;margin:0}
.erase-answer{min-height:38px!important;padding:4px 14px;border-radius:14px!important;background:#fff!important;color:var(--ink);font-size:20px!important;box-shadow:0 3px 0 rgba(31,42,68,.2)!important}
.erase-answer[hidden]{display:none}
.choice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choices button{min-height:86px;border-radius:24px;background:#fff;font-size:clamp(36px,7vw,54px);font-weight:700;box-shadow:0 6px 0 rgba(31,42,68,.22)}
.choices.multi button{min-height:62px;border-radius:18px}
.choices button:active{transform:translateY(4px);box-shadow:none}
.choices button:disabled{opacity:.8}
.choices button.correct{background:#b6eccb}
.choices button.wrong{background:#ffc3b9;color:#a51e12;outline:5px solid #c43d28}
.mathfeedback{min-height:42px;text-align:center;font-size:clamp(25px,4.5vw,34px);font-weight:700;margin:8px 0 0}
.mathfeedback.correct{color:#12663e}
.mathfeedback.wrong{color:#a51e12}
.mathnext{min-height:82px!important}
@media(max-height:700px){
  #home h1{font-size:clamp(36px,7vw,52px);margin:4px 0 2px}
  #home .sub{font-size:18px;margin-bottom:8px}
  #list{gap:7px}
  .deck{padding:7px 12px;border-radius:20px;gap:7px}
  .deck-reset{min-height:40px;padding:6px 8px;font-size:14px}
  .deck b{font-size:clamp(24px,4.5vw,32px)}
  .deck span{font-size:clamp(15px,3vw,19px);margin:2px 0 5px}
  .deck .activity-progress{height:18px}
  .footer .micbtn{width:54px;height:54px}
  .footer .link{font-size:19px;padding:12px 6px}
  .bondsvg{max-height:30vh}
  .bondsvg.three-on{max-height:23vh}
  .bondcard{padding:8px 4%;gap:2px}
  .choices button{min-height:66px}
  .scramble-card{padding:14px;gap:8px}
  .sentence-slots{min-height:120px;gap:8px;padding:10px 2px}
  .answer-slot{height:58px;min-width:66px;padding:6px 8px}
  .scramble-bank{min-height:112px;gap:8px;padding:10px 2px 6px}
  .scramble-word{min-height:54px;padding:7px 12px}
}
@media(max-height:600px){
  #app{padding:max(8px,env(safe-area-inset-top)) 16px max(8px,env(safe-area-inset-bottom))}
  #home h1{font-size:34px;margin:0 0 1px}
  #home .sub{font-size:16px;margin-bottom:4px}
  #list{gap:4px}
  .deck{padding:4px 8px;gap:5px}
  .deck b{font-size:22px}
  .deck span{font-size:13px;margin:1px 0 4px}
  .deck-reset{min-height:32px;padding:4px 6px;font-size:12px}
  .footer .micbtn{width:44px;height:44px}
  .footer .link{font-size:16px;padding:8px 4px}
}
</style>
</head>
<body>
<div id="app">
  <section class="screen" id="home">
    <h1>Learning is fun</h1>
    <p class="sub">Pick something to practice</p>
    <div id="list"></div>
    <div class="footer"><button class="micbtn" id="recOpen" aria-label="Parents: record voice"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button><button class="link install-link" id="installApp">Install app</button></div>
  </section>

  <section class="screen" id="play">
    <div class="top">
      <button class="back" id="back">Home</button>
      <div class="dots" id="dots"></div>
    </div>
    <div class="card" id="card">
      <div class="word" id="word"></div>
      <button class="speak" id="speak" aria-label="Hear the word"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
    </div>
    <div class="actions">
      <button class="again" id="prev">Previous</button>
      <button class="know" id="nextWord">Next</button>
    </div>
  </section>

  <section class="screen" id="sent">
    <div class="top"><button class="back" id="back2">Home</button><div class="reccount" id="readCount"></div></div>
    <div class="activity-progress"><i class="bar"><u id="readProgress" style="width:0%"></u></i></div>
    <div class="card" id="card2">
      <div class="sentence" id="sentence"></div>
      <button class="speak" id="speak2" aria-label="Hear the sentence"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
    </div>
    <div class="actions one"><button class="know" id="next">Next sentence</button></div>
  </section>

  <section class="screen" id="buildSent">
    <div class="top"><button class="back" id="buildBack">Home</button><div class="reccount" id="buildSentCount"></div></div>
    <div class="activity-progress"><i class="bar"><u id="buildProgress" style="width:0%"></u></i></div>
    <div class="card scramble-card">
      <p class="scramble-instruction">Drag each word into the matching tile.</p>
      <div class="sentence-slots" id="sentenceSlots" aria-label="Sentence answer tiles"></div>
      <div class="scramble-bank" id="scrambleBank" aria-label="Scrambled words"></div>
    </div>
    <p class="scramblefeedback" id="scrambleFeedback" aria-live="polite"></p>
    <div class="actions one"><button class="know" id="checkScramble">Check sentence</button><button class="know" id="nextScramble" hidden>Next sentence</button></div>
  </section>

  <section class="screen" id="math">
    <div class="top"><button class="back" id="mathBack">Home</button><div class="reccount" id="mathCount"></div></div>
    <div class="activity-progress"><i class="bar"><u id="mathProgress" style="width:0%"></u></i></div>
    <div class="card bondcard" id="bondCard">
      <svg class="bondsvg" id="bondSvg" viewBox="0 0 400 300" role="img" aria-label="Number bond diagram">
        <line id="bondLineA" class="bondline" x1="200" y1="82" x2="95" y2="220"/><line id="bondLineB" class="bondline" x1="200" y1="82" x2="305" y2="220"/><line id="bondLineC" class="bondline three-bond" x1="200" y1="82" x2="200" y2="220"/>
        <circle id="bondWholeCircle" class="bondnode bondnode-circle" cx="200" cy="82" r="72"/><rect id="bondWholeSquare" class="bondnode bondnode-square" x="128" y="10" width="144" height="144" rx="14"/><text id="bondWhole" class="bondnumber bondnumber-whole" x="200" y="82"></text>
        <circle id="bondPartACircle" class="bondnode bondnode-circle" cx="95" cy="220" r="57"/><rect id="bondPartASquare" class="bondnode bondnode-square" x="38" y="163" width="114" height="114" rx="14"/><text id="bondPartA" class="bondnumber" x="95" y="220"></text>
        <circle id="bondPartBCircle" class="bondnode bondnode-circle" cx="305" cy="220" r="57"/><rect id="bondPartBSquare" class="bondnode bondnode-square" x="248" y="163" width="114" height="114" rx="14"/><text id="bondPartB" class="bondnumber" x="305" y="220"></text>
        <g class="three-part-node"><circle id="bondPartCCircle" class="bondnode bondnode-circle" cx="200" cy="220" r="57"/><rect id="bondPartCSquare" class="bondnode bondnode-square" x="143" y="163" width="114" height="114" rx="14"/><text id="bondPartC" class="bondnumber" x="200" y="220"></text></g>
      </svg>
      <p class="equation" id="bondEquation"></p>
    </div>
    <p class="mathfeedback" id="mathFeedback" aria-live="polite"></p>
    <div class="choices" id="mathChoices"></div>
    <div class="actions one"><button class="know mathnext" id="mathNext" hidden>Next</button></div>
  </section>

  <section class="screen" id="blockDone">
    <div class="stars">★★★★★</div><h2 id="blockDoneTitle">Block complete!</h2><p id="blockDoneText"></p>
    <button class="big" id="blockNext">Next block</button><button class="link" id="blockHome">Back home</button>
  </section>

  <section class="screen" id="rec">
    <div class="top"><button class="back" id="back3">Home</button><div class="reccount" id="recCount"></div></div>
    <div class="tabs"><button class="tab on" id="tabW">Words</button><button class="tab" id="tabS">Sentences</button></div>
    <div class="card" id="card3">
      <div id="recText" class="word"></div>
      <div class="stat" id="recStat"></div>
      <button class="speak" id="speak3" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
    </div>
    <div class="actions three">
      <button class="nav" id="recPrev">Prev</button>
      <button class="rec" id="recGo">● Record</button>
      <button class="nav" id="recNext">Next</button>
    </div>
  </section>

  <section class="screen" id="done">
    <div class="stars">★★★★★</div>
    <h2>All done!</h2>
    <p id="doneText"></p>
    <button class="big" id="home2">Back home</button>
  </section>
</div>

<div id="gate">
  <div class="gatebox">
    <p>Parents only. Solve to continue:</p>
    <p id="gateQ"></p>
    <input id="gateA" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Answer">
    <p id="gateMsg"></p>
    <div class="gbtns"><button id="gateNo">Cancel</button><button id="gateYes">Open</button></div>
  </div>
</div>

<div id="installHelp" role="dialog" aria-modal="true" aria-labelledby="installTitle">
  <div class="installbox">
    <h2 id="installTitle">Install Learning is fun</h2>
    <p id="installHelpText"></p>
    <button id="installClose">Got it</button>
  </div>
</div>

<script>
let DECKS=[],SENTS=[],MATH=[],MATH3=[];
let installPrompt=null;
const SAY={a:"uh"};
const KEY="wordcards-learned-v1";
const ACTIVITY_KEY="learning-is-fun-progress-v1";
const SIZE=20;
const $=id=>document.getElementById(id);
let learned=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(learned))}catch(e){}};

  const blockSize=key==="building"?10:20;
  activityProgress[key]={block,progress,completed:Number.isInteger(state.completed)&&state.completed>=0?state.completed:(block-1)*blockSize+progress,items:Array.isArray(state.items)?state.items:[]};

function saveActivityProgress(){try{localStorage.setItem(ACTIVITY_KEY,JSON.stringify(activityProgress))}catch(e){}}
function shuffledBlock(source,size){
  const result=[],pool=[];
  while(result.length<size){if(!pool.length)pool.push(...shuffle(source.slice()));result.push(pool.pop())}
  return result;
}
function prepareBlock(key,size,makeItems){
  const state=activityProgress[key];
  if(state.progress>=size){state.block++;state.progress=0;state.items=[]}
  if(state.items.length!==size)state.items=makeItems();
  saveActivityProgress();
  return state;
}
function updateActivityProgress(id,key,size){
  const state=activityProgress[key];
  $(id).style.width=`${Math.round(100*state.progress/size)}%`;
}
function blockMarkup(key,total,label){
  const state=activityProgress[key],completed=Math.min(state.completed,total),pct=total?Math.round(100*completed/total):0;
  return `<span>${completed} of ${total} ${label}</span><i class="bar activity-progress"><u style="width:${pct}%"></u></i>`;
}
function markActivityComplete(key,total){activityProgress[key].completed=Math.min(total,activityProgress[key].completed+1);saveActivityProgress()}

let voice=null,utter=null,reading=false;
const englishVoices=()=>{try{return speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.replace("_","-").startsWith("en"))}catch(e){return[]}};
function pickVoice(){
  const v=englishVoices();
  const female=/samantha|ava|allison|susan|zoe|nicky|joelle|karen|moira|tessa|serena|kate|female/i;
  const male=/alex|fred|tom|aaron|evan|nathan|daniel|oliver|arthur|gordon|rishi/i;
  const us=x=>x.lang.replace("_","-")==="en-US";
  const good=x=>/enhanced|premium/i.test(x.name);
  const pick=/\b(ava|zoe)\b/i;
  voice=v.find(x=>pick.test(x.name)&&/premium/i.test(x.name))
     ||v.find(x=>pick.test(x.name)&&/enhanced/i.test(x.name))
     ||v.find(x=>us(x)&&female.test(x.name)&&good(x))
     ||v.find(x=>us(x)&&female.test(x.name))
     ||v.find(x=>female.test(x.name))
     ||v.find(x=>us(x)&&!male.test(x.name))
     ||v.find(x=>us(x))||v[0]||null;
}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function finishReading(){reading=false;document.querySelectorAll(".speak").forEach(b=>b.disabled=false)}
function say(w){
  if(reading)return;
  reading=true;document.querySelectorAll(".speak").forEach(b=>b.disabled=true);
  try{player.pause()}catch(e){}
  if(clips.has(w)){
    try{speechSynthesis.cancel()}catch(e){}
    dirty=true;player.src=clips.get(w);
    player.onended=finishReading;player.onerror=finishReading;
    player.play().catch(finishReading);
    return;
  }
  try{
    const s=speechSynthesis;
    if(s.speaking||s.pending)s.cancel();
    s.resume();
    utter=new SpeechSynthesisUtterance(SAY[w]||w);
    utter.onend=finishReading;utter.onerror=finishReading;
    utter.lang="en-US";utter.rate=.8;utter.volume=1;
    if(!voice)pickVoice();
    if(voice)utter.voice=voice;
    s.speak(utter);
  }catch(e){finishReading()}
}

function stopRec(play){
  if(stopP)return stopP;
  autoplay=!!play;
  stopP=new Promise(res=>{stopCb=res;mr.stop()});
  return stopP;
}
async function settleRec(){if(recording||stopP){autoplay=false;await stopRec()}}
async function leaveRec(){
  try{await settleRec()}catch(e){}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  home();
}
async function toggleRec(){
  if(recording||stopP){if(!stopP)stopRec(true);return}
  if(!ritems.length)return;
  try{
    if(!navigator.mediaDevices||!window.MediaRecorder){$("recStat").textContent="Recording isn't supported here.";return}
    try{player.pause()}catch(e){}
    const live=stream&&stream.getAudioTracks().some(t=>t.readyState==="live"&&!t.muted);
    if(dirty||!live){
      if(stream)stream.getTracks().forEach(t=>t.stop());
      stream=await navigator.mediaDevices.getUserMedia({audio:true});
      dirty=false;
    }
    const mime=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t=>MediaRecorder.isTypeSupported(t));
    const key=ritems[ri];chunks=[];
    mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=async()=>{
      recording=false;setRecUI();
      const blob=new Blob(chunks,{type:mr.mimeType||"audio/mp4"});
      let ok=false;
      try{if(blob.size>1000){await saveClip(key,blob);ok=true}}catch(e){}
      if(!ok)dirty=true;
      const play=autoplay,cb=stopCb;stopCb=null;stopP=null;
      if(play){
        showRec();
        if(ok){dirty=true;player.src=clips.get(key);player.play().catch(()=>{})}
        else $("recStat").textContent="Didn't hear anything. Tap Record to try again.";
      }
      if(cb)cb();
    };
    mr.start();recording=true;setRecUI();
  }catch(e){$("recStat").textContent="Microphone is blocked. Tap Allow when asked."}
}

let scrambleTarget="",scrambleTokens=[],scrambleBank=[],scrambleSlots=[],scrambleIndex=0,scrambleLocked=false,sentenceDrag=null;
function renderScrambleWords(){
  const slots=$("sentenceSlots"),bank=$("scrambleBank");slots.innerHTML="";bank.innerHTML="";
  scrambleSlots.forEach((token,index)=>{
    const tile=document.createElement("button");tile.type="button";tile.className="answer-slot"+(token?" filled":"");tile.dataset.origin="slot";tile.dataset.index=index;
    const tileFont=Math.min(40,Math.max(25,window.innerWidth*.054));
    const expectedLength=scrambleTokens[index].word.length;
    tile.style.width=`${Math.max(78,Math.min(250,expectedLength*tileFont*.55+46))}px`;
    tile.setAttribute("aria-label",token?`Sentence tile ${index+1}: ${token.word}`:`Empty sentence tile ${index+1}`);
    tile.textContent=token?token.word:"";slots.appendChild(tile);
  });
  scrambleBank.forEach((token,index)=>{
    const tile=document.createElement("button");tile.type="button";tile.className="scramble-word";tile.dataset.origin="bank";tile.dataset.index=index;
    tile.setAttribute("aria-label",`Drag word ${token.word}`);tile.textContent=token.word;bank.appendChild(tile);
  });
}
function nextScrambleSentence(){
  const state=activityProgress.building;
  if(state.progress>=10){finishBlock("building","You built 10 sentences!");return}
  scrambleIndex=state.progress+1;
  scrambleTarget=state.items[state.progress];if(!scrambleTarget)return;
  scrambleTokens=scrambleTarget.trim().split(/\s+/).map((word,id)=>({word,id}));
  scrambleBank=shuffle(scrambleTokens.slice());scrambleSlots=Array(scrambleTokens.length).fill(null);
  if(scrambleTokens.length>1&&scrambleBank.every((token,index)=>token.id===index))scrambleBank.push(scrambleBank.shift());
  scrambleLocked=false;
  $("buildSentCount").textContent=`Block ${state.block} · Sentence ${scrambleIndex} of 10`;
  $("nextScramble").textContent="Next sentence";
  updateActivityProgress("buildProgress","building",10);
  $("scrambleFeedback").textContent="";$("scrambleFeedback").className="scramblefeedback";
  $("checkScramble").hidden=false;$("nextScramble").hidden=true;
  renderScrambleWords();
}
function startScramble(){
  const shortSentences=buildableSentences();
  if(!shortSentences.length){show("buildSent");$("scrambleFeedback").textContent="No short sentences are available yet.";return}
  prepareBlock("building",10,()=>shuffledBlock(shortSentences,10));
  scrambleIndex=0;scrambleTarget="";show("buildSent");nextScrambleSentence();
}
function checkScrambleSentence(){
  const correct=scrambleSlots.length===scrambleTokens.length&&scrambleSlots.every((token,index)=>token&&token.id===index);
  const feedback=$("scrambleFeedback");
  feedback.className="scramblefeedback "+(correct?"correct":"wrong");
  feedback.textContent=correct?"✓ Great job! The sentence is in order.":scrambleSlots.some(token=>!token)?"Drag a word to every empty tile.":"Try again. Move the words around.";
  if(correct){
    scrambleLocked=true;$("checkScramble").hidden=true;$("nextScramble").hidden=false;
    activityProgress.building.progress++;markActivityComplete("building",buildableSentences().length);
    updateActivityProgress("buildProgress","building",10);
    $("buildSentCount").textContent=`Block ${activityProgress.building.block} · ${activityProgress.building.progress} of 10 complete`;
    if(activityProgress.building.progress>=10)$("nextScramble").textContent="See my stars";
  }
}
function placeScrambleWord(origin,sourceIndex,destination){
  if(destination.type==="slot"){
    const targetIndex=destination.index;
    if(origin==="bank"){
      const [token]=scrambleBank.splice(sourceIndex,1),displaced=scrambleSlots[targetIndex];
      scrambleSlots[targetIndex]=token;if(displaced)scrambleBank.push(displaced);
    }else if(sourceIndex!==targetIndex){
      [scrambleSlots[sourceIndex],scrambleSlots[targetIndex]]=[scrambleSlots[targetIndex],scrambleSlots[sourceIndex]];
    }
  }else if(destination.type==="bank"&&origin==="slot"){
    const [token]=scrambleSlots.splice(sourceIndex,1,null);if(token)scrambleBank.push(token);
  }
  $("scrambleFeedback").textContent="";$("scrambleFeedback").className="scramblefeedback";renderScrambleWords();
}
const scrambleCard=$("buildSent");
scrambleCard.addEventListener("pointerdown",e=>{
  const tile=e.target.closest(".answer-slot.filled,.scramble-word");if(!tile||scrambleLocked)return;
  sentenceDrag={pointerId:e.pointerId,origin:tile.dataset.origin,index:Number(tile.dataset.index),tile,startX:e.clientX,startY:e.clientY,moved:false};
  tile.classList.add("dragging");tile.setPointerCapture(e.pointerId);e.preventDefault();
});
scrambleCard.addEventListener("pointermove",e=>{
  if(!sentenceDrag||sentenceDrag.pointerId!==e.pointerId)return;
  const dx=e.clientX-sentenceDrag.startX,dy=e.clientY-sentenceDrag.startY;
  if(Math.abs(dx)+Math.abs(dy)>8)sentenceDrag.moved=true;
  if(sentenceDrag.moved){sentenceDrag.tile.style.transform=`translate(${dx}px, ${dy}px)`;e.preventDefault()}
});
scrambleCard.addEventListener("pointerup",e=>{
  if(!sentenceDrag||sentenceDrag.pointerId!==e.pointerId)return;
  const drag=sentenceDrag;sentenceDrag=null;
  if(drag.moved){
    const target=document.elementFromPoint(e.clientX,e.clientY),slot=target&&target.closest(".answer-slot"),bank=target&&target.closest(".scramble-bank");
    if(slot)placeScrambleWord(drag.origin,drag.index,{type:"slot",index:Number(slot.dataset.index)});
    else if(bank)placeScrambleWord(drag.origin,drag.index,{type:"bank"});
    else renderScrambleWords();
  }else drag.tile.classList.remove("dragging");
});
scrambleCard.addEventListener("pointercancel",e=>{
  if(!sentenceDrag||sentenceDrag.pointerId!==e.pointerId)return;
  sentenceDrag=null;renderScrambleWords();
});

let mathQuestions=[],mathIndex=0,mathScore=0,mathLocked=false;
function makeMathQuestion(bond,forcedOperation){
  const {whole,partA,partB}=bond;
  const blank=["whole","partA","partB"][Math.floor(Math.random()*3)];
  const answer=blank==="whole"?whole:blank==="partA"?partA:partB;
  const shown={whole,partA,partB};shown[blank]="?";
  const operation=forcedOperation||(Math.random()<0.5?"+":"-");
  return{whole,partA,partB,blank,answer,shown,operation};
}
function makeThreeMathQuestion(bond){
  const {whole,partA,partB,partC}=bond;
  const shown={whole,partA,partB,partC};
  const blankKeys=["partB","partC"];
  blankKeys.forEach(key=>shown[key]="?");
  return{kind:"three",whole,partA,partB,partC,shown,blankKeys,answers:{partA,partB,partC},selected:{}};
}
function mathEquation(q){
  if(q.kind==="three")return `${q.shown.partA} + ${q.shown.partB} + ${q.shown.partC} = ${q.shown.whole}`;
  if(q.operation==="+")return `${q.shown.partA} + ${q.shown.partB} = ${q.shown.whole}`;
  if(q.blank==="whole")return `? - ${q.shown.partA} = ${q.shown.partB}`;
  if(q.blank==="partA")return `${q.shown.whole} - ? = ${q.shown.partB}`;
  return `${q.shown.whole} - ${q.shown.partA} = ?`;
}
function startMath(){
  if(MATH.length<5||MATH3.length<10){
    $("mathCount").textContent="Add at least 5 two-part and 10 three-part bonds to the JSON lists.";
    show("math");return;
  }
  const state=prepareBlock("math",20,()=>{
    const additions=shuffle(MATH.map(bond=>makeMathQuestion(bond,"+"))).slice(0,5);
    const subtractions=shuffle(MATH.map(bond=>makeMathQuestion(bond,"-"))).slice(0,5);
    const threePart=shuffle(MATH3.map(makeThreeMathQuestion)).slice(0,10);
    return shuffle([...additions,...subtractions,...threePart]);
  });
  mathQuestions=state.items;mathIndex=state.progress;
  mathScore=mathQuestions.filter(question=>question.scored).length;
  show("math");renderMath();
}
function renderMath(){
  const q=mathQuestions[mathIndex];mathLocked=false;
  if(!q)return;
  const isThree=q.kind==="three";
  $("mathCount").textContent=`Block ${activityProgress.math.block} · Question ${mathIndex+1} of 20`;
  updateActivityProgress("mathProgress","math",20);
  $("bondSvg").classList.toggle("square-on",Math.random()<0.5);
  $("bondSvg").classList.toggle("three-on",isThree);
  const layouts=isThree?[
    {whole:[200,82],partA:[65,230],partB:[200,230],partC:[335,230]},
    {whole:[200,218],partA:[65,70],partB:[200,70],partC:[335,70]}
  ]:[
    {whole:[200,82],partA:[95,220],partB:[305,220]},
    {whole:[200,225],partA:[80,65],partB:[320,65]},
    {whole:[82,150],partA:[300,80],partB:[300,220]},
    {whole:[318,150],partA:[100,80],partB:[100,220]}
  ];
  const layout=layouts[Math.floor(Math.random()*layouts.length)];
  const keys=["whole","partA","partB",...(isThree?["partC"]:[])];
  for(const key of keys){
    const suffix=key==="whole"?"Whole":key==="partA"?"PartA":key==="partB"?"PartB":"PartC";
    const text=$("bond"+suffix),circle=$("bond"+suffix+"Circle"),square=$("bond"+suffix+"Square");
    const [x,y]=layout[key],size=key==="whole"?144:114;
    circle.setAttribute("cx",x);circle.setAttribute("cy",y);
    square.setAttribute("x",x-size/2);square.setAttribute("y",y-size/2);
    text.setAttribute("x",x);text.setAttribute("y",y);
    text.textContent=q.shown[key];text.classList.remove("correct","wrong");
    for(const shape of [circle,square]){
      shape.classList.remove("correct","wrong","subtraction-missing");
      const missing=q.blank===key||q.blankKeys?.includes(key);
      shape.classList.toggle("missing",missing);
      shape.classList.toggle("subtraction-missing",q.operation==="-"&&missing);
    }
  }
  const lines=[["bondLineA","partA"],["bondLineB","partB"],...(isThree?[["bondLineC","partC"]]:[])];
  for(const [id,key] of lines){
    const line=$(id);line.setAttribute("x1",layout.whole[0]);line.setAttribute("y1",layout.whole[1]);
    line.setAttribute("x2",layout[key][0]);line.setAttribute("y2",layout[key][1]);
  }
  $("bondEquation").textContent=mathEquation(q);
  $("bondEquation").classList.toggle("three-equation",isThree);
  $("mathFeedback").textContent=isThree?"Make 10 first, then find the difference.":"";
  $("mathFeedback").className="mathfeedback";$("mathNext").hidden=true;
  if(isThree){
    $("mathChoices").classList.add("multi");
    $("mathChoices").innerHTML=q.blankKeys.map((key,i)=>{
      const options=mathNumberOptions(q.answers[key],i===0?9:10,i===0?1:0);
      const title=i===0?"Make 10":"How many left?";
      const erase=i===0?'<button type="button" class="erase-answer" hidden>Erase</button>':'';
      const disabled=i===1?' disabled':'';
      return `<div class="choice-group" data-slot="${key}"><div class="choice-heading"><div class="choice-title">${title}</div>${erase}</div><div class="choice-row">${options.map(n=>`<button type="button" data-answer="${n}"${disabled}>${n}</button>`).join("")}</div></div>`;
    }).join("");
  }else{
    $("mathChoices").classList.remove("multi");
    const options=mathNumberOptions(q.answer,10,0);
    $("mathChoices").innerHTML=options.map(n=>`<button type="button" data-answer="${n}">${n}</button>`).join("");
  }
  pop("bondCard");
}
function mathNumberOptions(answer,max,min){
  const options=new Set([answer]);
  while(options.size<3)options.add(min+Math.floor(Math.random()*(max-min+1)));
  return shuffle([...options]);
}
function markMathNode(key,value,result){
  const suffix=key==="whole"?"Whole":key==="partA"?"PartA":key==="partB"?"PartB":"PartC";
  const text=$("bond"+suffix),circle=$("bond"+suffix+"Circle"),square=$("bond"+suffix+"Square");
  text.textContent=value;text.classList.remove("correct","wrong");text.classList.add(result);
  for(const shape of [circle,square]){shape.classList.remove("missing","subtraction-missing","correct","wrong");shape.classList.add(result)}
}
function checkThreeMath(q){
  mathLocked=true;
  const correctCount=q.blankKeys.filter(key=>q.selected[key]===q.answers[key]).length;
  q.blankKeys.forEach(key=>markMathNode(key,q.selected[key],q.selected[key]===q.answers[key]?"correct":"wrong"));
  $("bondEquation").textContent=mathEquation(q);
  q.scored=correctCount===q.blankKeys.length;
  if(q.scored&&!q.counted){mathScore++;q.counted=true;saveActivityProgress()}
  for(const group of $("mathChoices").children){
    const key=group.dataset.slot;
    for(const option of group.querySelectorAll(".choice-row button")){
      option.disabled=true;
      if(Number(option.dataset.answer)===q.answers[key])option.classList.add("correct");
      else if(Number(option.dataset.answer)===q.selected[key])option.classList.add("wrong");
    }
  }
  const erase=$("mathChoices").querySelector(".erase-answer");
  if(erase)erase.hidden=q.scored;
  $("mathFeedback").classList.add(correctCount===q.blankKeys.length?"correct":"wrong");
  $("mathFeedback").textContent=correctCount===q.blankKeys.length?"✓ Both numbers are right!":`✗ The missing numbers are ${q.blankKeys.map(key=>q.answers[key]).join(" and ")}.`;
  $("mathNext").textContent=mathIndex+1===mathQuestions.length?"See my stars":"Next";$("mathNext").hidden=false;
}
$("mathChoices").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const q=mathQuestions[mathIndex];
  if(q.kind==="three"){
    if(b.classList.contains("erase-answer")){
      if(!Object.prototype.hasOwnProperty.call(q.selected,"partB"))return;
      const wasLocked=mathLocked;
      if(wasLocked)mathScore=Math.max(0,mathScore-(q.scored?1:0));
      mathLocked=false;q.scored=false;q.counted=false;saveActivityProgress();
      delete q.selected.partB;delete q.selected.partC;
      q.shown.partB="?";q.shown.partC="?";
      for(const key of ["partB","partC"]){
        const suffix=key==="partB"?"PartB":"PartC";
        const node=$("bond"+suffix),shape=$("bond"+suffix+"Circle"),square=$("bond"+suffix+"Square");
        node.textContent="?";node.classList.remove("correct","wrong");
        for(const item of [shape,square]){item.classList.remove("correct","wrong");item.classList.add("missing")}
      }
      $("bondEquation").textContent=mathEquation(q);
      $("mathFeedback").className="mathfeedback";$("mathFeedback").textContent="Make 10 first, then find the difference.";
      $("mathNext").hidden=true;
      for(const option of $("mathChoices").querySelectorAll(".choice-row button")){option.disabled=false;option.classList.remove("correct","wrong")}
      for(const option of $("mathChoices").querySelectorAll('[data-slot="partC"] button'))option.disabled=true;
      b.hidden=true;
      return;
    }
    if(mathLocked)return;
    const group=b.closest(".choice-group"),key=group.dataset.slot;
    if(key==="partC"&&!Object.prototype.hasOwnProperty.call(q.selected,"partB"))return;
    if(Object.prototype.hasOwnProperty.call(q.selected,key))return;
    q.selected[key]=Number(b.dataset.answer);
    q.shown[key]=q.selected[key];$("bondEquation").textContent=mathEquation(q);
    $("bond"+(key==="partA"?"PartA":key==="partB"?"PartB":"PartC")).textContent=q.selected[key];
    group.querySelectorAll(".choice-row button").forEach(option=>option.disabled=true);
    if(key==="partB"){
      group.querySelector(".erase-answer").hidden=false;
      $("mathChoices").querySelectorAll('[data-slot="partC"] button').forEach(option=>option.disabled=false);
    }
    if(q.blankKeys.every(slot=>Object.prototype.hasOwnProperty.call(q.selected,slot)))checkThreeMath(q);
    return;
  }
  if(mathLocked)return;
  mathLocked=true;
  const answer=Number(b.dataset.answer),correct=answer===mathQuestions[mathIndex].answer;
  markMathNode(q.blank,answer,correct?"correct":"wrong");
  q.shown[q.blank]=answer;$("bondEquation").textContent=mathEquation(q);
  if(correct&&!q.scored){mathScore++;q.scored=true;q.counted=true;saveActivityProgress()}
  [...$("mathChoices").children].forEach(option=>{option.disabled=true;if(Number(option.dataset.answer)===mathQuestions[mathIndex].answer)option.classList.add("correct");else if(option===b)option.classList.add("wrong")});
  $("mathFeedback").classList.add(correct?"correct":"wrong");
  $("mathFeedback").textContent=correct?"✓ Yes! That’s right!":"✗ Not quite! The answer is "+mathQuestions[mathIndex].answer+".";
  $("mathNext").textContent=mathIndex+1===mathQuestions.length?"See my stars":"Next";$("mathNext").hidden=false;
});
$("mathNext").addEventListener("click",()=>{
  activityProgress.math.progress++;markActivityComplete("math",availableMathBonds());
  if(activityProgress.math.progress<20){mathIndex=activityProgress.math.progress;renderMath()}
  else finishBlock("math",`You got ${mathScore} out of 20 number bonds!`);
});

loadClips();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const load=f=>fetch(f,{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(f);return r.json()});
load("words.json")
  .then(d=>{DECKS=d;return load("sentences.json").catch(()=>[])})
  .then(s=>{SENTS=s;return load("numberBonds.json").catch(()=>[])})
  .then(b=>{MATH=b;return load("threeNumberBonds.json").catch(()=>[])})
  .then(b=>{MATH3=b;home()})
  .catch(()=>{$("list").innerHTML='<p class="sub">Could not load the word lists.</p>';show("home")});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
